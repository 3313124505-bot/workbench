<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff7a45">
<meta name="description" content="个人工作台 - 灵感/塑形/阅读/情报一站搞定">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>个人工作台</title>
<style>
  :root{--bg-grad-1:#ffd9c2;--bg-grad-2:#c9b6ff;--bg-grad-3:#9fd4ff;--panel:rgba(255,255,255,.92);--border:rgba(255,255,255,.65);--text:#2b2440;--muted:#7a7186;--accent:#ff7a45;--accent-2:#a06bff;--accent-3:#3aa0ff;--shadow:0 12px 40px rgba(80,40,120,.18);--radius:18px;--radius-sm:12px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg-grad-1) 0%,var(--bg-grad-2) 55%,var(--bg-grad-3) 100%);background-attachment:fixed;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px}
  .phone{width:100%;max-width:430px;height:96vh;min-height:680px;background:var(--panel);border:1px solid var(--border);border-radius:36px;box-shadow:var(--shadow),0 0 0 10px rgba(255,255,255,.4);overflow:hidden;position:relative;display:flex;flex-direction:column}
  .status-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 22px 4px;font-size:13px;font-weight:600;background:rgba(255,255,255,.5)}
  .status-bar .right{display:flex;gap:5px;align-items:center;font-size:11px}
  .app-header{padding:10px 18px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
  .app-header .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#ff7a45,#a06bff);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 10px rgba(255,122,69,.4)}
  .app-header .title{font-weight:700;font-size:15px}
  .app-header .sub{font-size:11px;color:var(--muted);margin-top:1px}
  .app-header .spacer{flex:1}
  .icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.6);display:grid;place-items:center;cursor:pointer;font-size:14px}
  .tab-scroll{display:flex;gap:8px;padding:10px 14px 12px;overflow-x:auto;border-bottom:1px solid var(--border)}
  .tab-scroll::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;padding:7px 14px;border-radius:999px;font-size:13px;color:#5a5470;cursor:pointer;white-space:nowrap;transition:all .18s;border:1px solid var(--border);background:rgba(255,255,255,.6)}
  .tab.active{background:linear-gradient(135deg,#ff7a45,#ff9a6b);color:#fff;font-weight:600;box-shadow:0 4px 10px rgba(255,122,69,.35);border-color:transparent}
  .tab .dot{display:inline-block;width:6px;height:6px;background:#ff4d4f;border-radius:50%;margin-left:4px;vertical-align:middle}
  .content{flex:1;overflow-y:auto;padding:14px 14px 80px}
  .content::-webkit-scrollbar{width:4px}
  .content::-webkit-scrollbar-thumb{background:rgba(120,90,160,.3);border-radius:8px}
  .panel{display:none;animation:fade .35s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:rgba(255,255,255,.82);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
  .card.hoverable{cursor:pointer;transition:transform .2s,box-shadow .2s}
  .card.hoverable:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(120,80,160,.15)}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
  .card-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex:1;min-width:0}
  .card-meta{font-size:11px;color:var(--muted)}
  .tag{display:inline-block;padding:2px 7px;border-radius:7px;font-size:10px;background:rgba(160,107,255,.14);color:var(--accent-2);margin-right:4px}
  .tag.orange{background:rgba(255,122,69,.14);color:var(--accent)}
  .tag.blue{background:rgba(58,160,255,.14);color:var(--accent-3)}
  .tag.red{background:rgba(255,77,79,.14);color:#ff4d4f}
  .tag.green{background:rgba(105,219,124,.18);color:#1d6b2a}
  .list-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(120,90,160,.15)}
  .list-item:last-child{border-bottom:none;padding-bottom:0}
  .li-num{width:24px;height:24px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,#ff7a45,#a06bff);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
  .li-body{flex:1;min-width:0}
  .li-title{font-size:13px;font-weight:600;margin-bottom:3px;line-height:1.4}
  .li-desc{font-size:11px;color:var(--muted);line-height:1.5}
  .li-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .li-btn{font-size:11px;padding:5px 11px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,.85);text-decoration:none;display:inline-block;color:var(--text)}
  .li-btn.bilibili{color:#00a1d6;border-color:rgba(0,161,214,.35)}
  .li-btn.douyin{color:#000;border-color:rgba(0,0,0,.25)}
  .li-btn.weixin{color:#1aad19;border-color:rgba(26,173,25,.35)}
  .li-btn.ximalaya{color:#a02020;border-color:rgba(160,32,32,.3)}
  .li-btn.snail{color:#d48806;border-color:rgba(212,136,6,.3)}
  .li-btn.video{color:var(--accent);border-color:rgba(255,122,69,.35)}
  .li-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(120,80,160,.15)}
  .calendar-wrap{background:linear-gradient(135deg,rgba(255,213,79,.18),rgba(160,107,255,.15));border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
  .calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .calendar-head h3{margin:0;font-size:13px}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-cell{aspect-ratio:1/1;border-radius:7px;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.6);color:#4a4360;cursor:pointer;transition:all .15s}
  .cal-cell.empty{background:transparent}
  .cal-cell.done{background:linear-gradient(135deg,#8ce99a,#69db7c);color:#1d6b2a;font-weight:700}
  .cal-cell.today{border:2px solid var(--accent);font-weight:700;color:var(--accent)}
  .cal-cell:hover:not(.empty){transform:scale(1.06)}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
  .cal-week div{text-align:center;font-size:10px;color:var(--muted)}
  .checkin-btn{margin-top:10px;width:100%;padding:9px;border:none;border-radius:11px;background:linear-gradient(135deg,#ff7a45,#ff9a6b);color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 14px rgba(255,122,69,.4)}
  .checkin-btn.done{background:linear-gradient(135deg,#8ce99a,#69db7c);box-shadow:0 6px 14px rgba(105,219,124,.4)}
  .input-box{width:100%;min-height:70px;padding:10px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.7);font-size:13px;font-family:inherit;resize:vertical;color:var(--text)}
  .input-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,69,.15)}
  .input-row{display:flex;gap:8px;margin-top:8px;align-items:center}
  .btn{padding:7px 14px;border:none;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
  .btn-primary{background:linear-gradient(135deg,#ff7a45,#ff9a6b);color:#fff;box-shadow:0 4px 10px rgba(255,122,69,.3)}
  .btn-ghost{background:rgba(255,255,255,.7);color:#5a5470;border:1px solid var(--border)}
  .char-count{margin-left:auto;font-size:10px;color:var(--muted)}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4d4f;margin-right:5px;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .refresh-bar{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:rgba(58,160,255,.12);border-radius:10px;margin-bottom:10px;font-size:11px}
  .progress{height:5px;background:rgba(120,90,160,.15);border-radius:5px;overflow:hidden;margin-top:5px}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,#ff7a45,#a06bff);border-radius:5px}
  .channel{display:flex;align-items:center;gap:9px;padding:10px;background:rgba(255,255,255,.7);border-radius:10px;margin-bottom:7px;border:1px solid var(--border);cursor:pointer;text-decoration:none;color:inherit;transition:all .18s}
  .channel:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(120,80,160,.12)}
  .channel .avatar{width:30px;height:30px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#a06bff,#3aa0ff);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .channel .info{flex:1;font-size:12px;min-width:0}
  .channel .info b{display:block;font-size:12px}
  .channel .info span{font-size:10px;color:var(--muted)}
  .channel .profit{font-size:12px;font-weight:700;color:#ff4d4f;white-space:nowrap}
  .block-title{font-size:12px;font-weight:600;color:var(--accent-2);margin:8px 0 8px;display:flex;align-items:center;gap:7px}
  .block-title::before{content:"";width:3px;height:13px;background:var(--accent-2);border-radius:3px}
  .tab-bar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 0 12px}
  .tab-bar .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer}
  .tb .ic{font-size:18px}
  .tb.active{color:var(--accent)}
  .tb.center .ic{width:42px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ff7a45,#ff9a6b);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 12px rgba(255,122,69,.4)}
  .move-video{margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#000}
  .move-video iframe{width:100%;height:200px;border:none;display:block}
  .move-video .video-actions{padding:8px;background:rgba(255,255,255,.85);display:flex;gap:6px;flex-wrap:wrap}
  .move-tip{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5}
  .step-box{background:rgba(58,160,255,.08);border-left:3px solid var(--accent-3);padding:8px 10px;border-radius:0 8px 8px 0;margin-top:8px}
  .step-box .sb-title{font-size:11px;font-weight:700;color:var(--accent-3);margin-bottom:4px}
  .step-box .sb-step{font-size:11px;color:#4a4360;line-height:1.6;padding-left:14px;position:relative}
  .step-box .sb-step::before{content:"▸";position:absolute;left:0;color:var(--accent-3)}
  .step-box.sell{background:rgba(105,219,124,.1);border-left-color:#1d6b2a}
  .step-box.sell .sb-title{color:#1d6b2a}
  .step-box.sell .sb-step::before{color:#1d6b2a}
  .rec-box{background:rgba(255,122,69,.1);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 8px 8px 0;margin-top:6px}
  .rec-box .rb-title{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px}
  .rec-box .rb-text{font-size:11px;color:#4a4360;line-height:1.5}
  .book-card{display:flex;gap:10px;padding:12px;background:rgba(255,255,255,.82);border-radius:11px;border:1px solid var(--border);margin-bottom:8px}
  .book-cover{width:54px;height:74px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:10px;text-align:center;line-height:1.2;padding:4px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.15)}
  .book-info{flex:1;min-width:0}
  .book-info .t{font-size:13px;font-weight:600;margin-bottom:3px}
  .book-info .a{font-size:10px;color:var(--muted);margin-bottom:4px}
  .book-info .d{font-size:11px;color:#5a5470;line-height:1.4;margin-bottom:6px}
  .book-actions{display:flex;gap:6px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(40,30,60,.88);color:#fff;padding:9px 16px;border-radius:11px;font-size:12px;backdrop-filter:blur(10px);z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.show{opacity:1}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:380px){.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span id="clock">10:17</span><div class="right"><span>5G</span><span>📶</span><span>▰▰▰▰</span><span>93%</span></div></div>
  <div class="app-header"><div class="logo">工</div><div><div class="title">个人工作台</div><div class="sub">AI Workbench · v3.0</div></div><div class="spacer"></div><div class="icon-btn" onclick="toast('设置')">⚙️</div><div class="icon-btn" onclick="toast('个人中心')">👤</div></div>
  <div class="tab-scroll" id="tabScroll">
    <div class="tab active" data-panel="inspiration">💡每日灵感</div>
    <div class="tab" data-panel="english">🗣英语口语</div>
    <div class="tab" data-panel="diet">🥗减脂饮食</div>
    <div class="tab" data-panel="shape">💪每日塑形</div>
    <div class="tab" data-panel="news">📰热点新闻</div>
    <div class="tab" data-panel="books">📚书籍推荐</div>
    <div class="tab" data-panel="money">💰理财存钱</div>
    <div class="tab" data-panel="infogap">⚡信息差</div>
    <div class="tab" data-panel="reseller">🛒二道贩子<span class="dot"></span></div>
    <div class="tab" data-panel="mind">🧘修心修行</div>
    <div class="tab" data-panel="blog">✍️博客精选</div>
  </div>
  <div class="content" id="content"></div>
  <div class="tab-bar">
    <div class="tb active" onclick="switchTo('inspiration')"><div class="ic">🏠</div><div>首页</div></div>
    <div class="tb" onclick="toast('朋友动态')"><div class="ic">👥</div><div>朋友</div></div>
    <div class="tb center" onclick="toast('发布新内容')"><div class="ic">+</div><div></div></div>
    <div class="tb" onclick="toast('消息中心')"><div class="ic">💬</div><div>消息</div></div>
    <div class="tb" onclick="toast('我的')"><div class="ic">👤</div><div>我</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const tabScroll=document.getElementById('tabScroll');
const panels=document.querySelectorAll('.panel');
function switchTo(p){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.panel===p));panels.forEach(s=>s.classList.toggle('active',s.id==='panel-'+p));const act=document.querySelector('.tab.active');if(act)act.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
tabScroll.addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;switchTo(t.dataset.panel)});
function tick(){const d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,1000*30);
let checked=false;
function checkin(){if(checked){toast('今天已打卡');return;}const btn=document.getElementById('checkinBtn');btn.classList.add('done');btn.textContent='✓ 今日已打卡';checked=true;toast('打卡成功!')}
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000)}
document.querySelectorAll('.tab-bar .tb').forEach(tb=>{tb.addEventListener('click',()=>{document.querySelectorAll('.tab-bar .tb').forEach(t=>t.classList.remove('active'));tb.classList.add('active')})});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(()=>console.log('SW ok')).catch(e=>console.warn('SW fail',e))})}
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const btn=document.createElement('div');btn.textContent='📲 安装到主屏幕';btn.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff7a45,#a06bff);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 6px 20px rgba(255,122,69,.4);cursor:pointer';btn.onclick=async()=>{btn.remove();deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null};document.body.appendChild(btn)});
</script>
</body>
</html>
